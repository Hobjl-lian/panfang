[package]
name = "wf-auth-server"
version = "0.1.0"
edition = "2021"
description = "盘坊授权服务：付费表盘加密分发 / 兑换码 / 授权（契约见 docs/接口契约-授权服务-v1.md）"
license = "MIT OR Apache-2.0"

[[bin]]
name = "wf-auth-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
tower-http = { version = "0.5", features = ["cors", "limit"] }
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
md5 = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
anyhow = "1"

[profile.release]
strip = true
lto = true
# panic 即退出，交给 systemd Restart=always 立刻拉起：
# 否则「持锁 panic → 全局 Mutex 中毒」会让进程活着但每个请求都 panic，
# systemd 看不到失败、服务变成永久 500，只能人工重启。
panic = "abort"
