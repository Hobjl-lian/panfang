# 授权服务：api.hobjl-shop.top → 127.0.0.1:8787
# 装到 /etc/nginx/sites-available/wf-auth.conf 并软链到 sites-enabled
# 证书：装完后跑 `certbot --nginx -d api.hobjl-shop.top`（certbot 会自动改写本文件）

server {
    listen 80;
    listen [::]:80;
    server_name api.hobjl-shop.top;

    # 上传 .bin 可能到几十 MB
    client_max_body_size 96m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 下载直链是 5 分钟签名，别被中间层缓存
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
