# 授权服务：api.hobjl-shop.top → 127.0.0.1:8787
# 装到 /etc/nginx/sites-available/wf-auth.conf 并软链到 sites-enabled
# 证书：装完后跑 `certbot --nginx -d api.hobjl-shop.top`（certbot 会自动改写本文件，但只动 server 块）

# ---- 限流（2026-10-15 加：抗刷。未登录接口是最容易被脚本灌库的目标）----
limit_req_zone $binary_remote_addr zone=wf_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=wf_strict:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=wf_conn:10m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name api.hobjl-shop.top;

    # 上传 .bin 可能到几十 MB（只有管理端用得上；公开接口在下面单独收紧）
    client_max_body_size 96m;
    # 单 IP 并发连接上限
    limit_conn wf_conn 30;

    # 公开、不需要登录、且最容易被打的两个接口：小体积 + 严格限流
    #   /v1/events               App 失败打点（每请求一批，正常在几十 KB 内）
    #   /v1/afdian/oauth/start   发起绑定（会写库，必须防刷）
    location ~ ^/v1/(events|afdian/oauth/start)$ {
        limit_req zone=wf_strict burst=30 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=wf_ip burst=100 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 下载直链是 5 分钟签名，别被中间层缓存
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
