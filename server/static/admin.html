<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>盘坊 · 管理后台</title>
<script>
/* 深色模式防闪白：首帧渲染前就定好 data-theme（三态切换的完整逻辑在页尾主脚本里） */
(function(){
  try{
    var m = localStorage.getItem('wf_admin_theme') || 'system';
    var dark = m === 'dark' || (m !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }catch(e){}
})();
</script>
<style>
  /* ===== token：一套 sans + 一套 mono；字重只有 400/500/600，不用 700 ===== */
  :root{
    --primary:#3D5AF1;
    --primary-weak:rgba(61,90,241,.09);
    --bg:#F4F5F7;
    --panel:#FFFFFF;
    --ink:#17191E;
    --ink-2:rgba(23,25,30,.62);
    --ink-3:rgba(23,25,30,.42);
    --line:rgba(23,25,30,.09);
    --ok:#157F3D;
    --danger:#C7332B;
    /* 深浅两套共用的派生色（各组件写死色的收敛） */
    --on-primary:#fff;            /* 主色上的文字 */
    --hover-bg:#FAFBFD;           /* 表格行 hover */
    --ghost-hover:#E9EBEF;        /* 次按钮 hover */
    --danger-weak:rgba(199,51,43,.07);   /* 危险按钮 hover */
    --chip-bg:#F2F3F7;            /* 标签小片 */
    --drop-bg:#FBFCFD;            /* 拖拽区底 */
    --drop-hot-bg:#F6F8FF;        /* 拖拽区命中 */
    --mask:rgba(23,25,30,.42);    /* 弹窗遮罩 */
    --toast-bg:#17191E;           /* toast 底 */
    --toast-ink:#fff;
    --ok-weak:rgba(21,127,61,.10);       /* 成功角标底 */
    --err-weak:rgba(199,51,43,.09);      /* 错误角标底 */
    --primary-line:rgba(61,90,241,.45);  /* 卡片 hover 描边 */
  }
  /* 深色模式：只翻面，字阶/布局/组件一律不动。data-theme 挂在 <html> 上，由顶栏三态按钮控制（跟随系统/浅/深） */
  html[data-theme="dark"]{
    --primary:#7B90FF;
    --primary-weak:rgba(123,144,255,.16);
    --bg:#141519;
    --panel:#1D1F24;
    --ink:#E8EAEE;
    --ink-2:rgba(232,234,238,.64);
    --ink-3:rgba(232,234,238,.42);
    --line:rgba(232,234,238,.11);
    --ok:#5BBE7E;
    --danger:#F26B62;
    --on-primary:#fff;
    --hover-bg:#23252B;
    --ghost-hover:#2A2D34;
    --danger-weak:rgba(242,107,98,.14);
    --chip-bg:#26282F;
    --drop-bg:#191B20;
    --drop-hot-bg:#1E2338;
    --mask:rgba(0,0,0,.55);
    --toast-bg:#E8EAEE;
    --toast-ink:#17191E;
    --primary-strong:#8FA2FF;      /* 主按钮 hover：深色下反而要变亮 */
    --drop-line:rgba(232,234,238,.22);
    --ok-weak:rgba(91,190,126,.14);
    --err-weak:rgba(242,107,98,.13);
    --primary-line:rgba(123,144,255,.5);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);min-height:100%;
    font:14px/1.55 "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* 字阶（只有这 6 级）：页标题 20 / 区块 15 / 正文 14 / 次要 13 / 微标签 12 / 数据 mono 12.5 */
  .page-title{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.3;margin:0}
  .panel-title{font-size:15px;font-weight:600;margin:0}
  .lead{font-size:14px}
  .meta{font-size:13px;color:var(--ink-2)}
  .micro{font-size:12px;font-weight:500;color:var(--ink-3)}
  .mono{font-family:ui-monospace,"SF Mono",Consolas,"Cascadia Mono",monospace;
        font-size:12.5px;font-variant-numeric:tabular-nums}
  .num{font-variant-numeric:tabular-nums}
  .sp{flex:1}
  a{color:var(--primary)}

  /* ===== 侧栏：功能入口 ===== */
  /* 侧栏固定：position:fixed 钉在视口左侧，内容滚动不带走它 */
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:212px;z-index:7;overflow-y:auto;
    background:var(--panel);border-right:1px solid var(--line);
    padding:18px 14px;display:flex;flex-direction:column;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px;text-decoration:none;color:var(--ink)}
  .brand-mark{width:28px;height:28px;border-radius:8px;background:var(--primary);color:var(--on-primary);
              display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex:0 0 auto}
  .brand-name{font-size:15px;font-weight:600;line-height:1.25}
  .brand-sub{font-size:11px;color:var(--ink-3);line-height:1.3}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav-item{
    display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
    font-size:13.5px;font-weight:500;color:var(--ink-2);text-decoration:none;
    transition:background .12s ease,color .12s ease;
  }
  .nav-item:hover{background:var(--bg);color:var(--ink)}
  .nav-item.active{background:var(--primary-weak);color:var(--primary)}
  .ic{width:15px;height:15px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.5;
      stroke-linecap:round;stroke-linejoin:round}

  /* ===== 顶栏 ===== */
  .frame{margin-left:212px;min-width:0;min-height:100vh;display:flex;flex-direction:column}
  .topbar{
    height:52px;flex:0 0 52px;display:flex;align-items:center;gap:14px;padding:0 28px;
    background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;
  }
  .stat{padding:0 12px;border-left:1px solid var(--line);font-size:13px;color:var(--ink-2);
        font-variant-numeric:tabular-nums}
  .stat:first-child{border-left:0;padding-left:0}
  .diag-line{font-size:13px;font-weight:500;color:var(--danger);text-decoration:none}
  .diag-line:hover{text-decoration:underline}

  main{max-width:1120px;width:100%;margin:0 auto;padding:26px 28px 72px}

  /* ===== 页头 ===== */
  .page-head{display:flex;align-items:flex-end;gap:16px;margin:0 0 18px}
  .page-desc{margin:6px 0 0;font-size:13px;color:var(--ink-2);line-height:1.6;max-width:640px}
  .crumb{font-size:13px;color:var(--ink-2);text-decoration:none;display:inline-block;margin-bottom:2px}
  .crumb:hover{color:var(--primary)}
  .page-meta{font-size:13px;font-weight:400;color:var(--ink-3);margin-left:10px}

  /* ===== 面板：白底发丝线，无阴影 ===== */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius,12px);
         padding:20px 22px;margin-bottom:16px}
  .panel-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .panel-hint{font-size:13px;color:var(--ink-2);line-height:1.65;margin:-6px 0 14px}
  .panel-hint.tight{margin:10px 0 0}

  /* ===== 表格 ===== */
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl th{font-size:12px;font-weight:500;color:var(--ink-3);text-align:left;
          padding:0 12px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:13px 12px;border-top:1px solid var(--line);vertical-align:top}
  .tbl tbody tr:first-child td{border-top:0}
  .tbl tbody tr:hover{background:var(--hover-bg)}
  .tbl .col-actions{text-align:right;white-space:nowrap}
  .tbl .col-actions .btn{margin-left:6px}
  .tbl .cell-name{width:23%}
  .row-name{font-size:14px;font-weight:600;line-height:1.45}
  .pack-line{margin-top:5px;display:flex;align-items:baseline;gap:8px}

  /* ===== 表单 ===== */
  .form-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
  input,select,textarea{
    font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--panel);
    border-radius:8px;padding:8px 11px;color:var(--ink);outline:none;
  }
  input::placeholder{color:var(--ink-3)}
  input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak)}
  input[type=file]{padding:6px 8px}
  .check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer}
  .check input{width:15px;height:15px;padding:0;accent-color:var(--primary)}

  /* ===== 按钮 ===== */
  .btn{
    font:inherit;font-size:13px;font-weight:500;border:0;cursor:pointer;border-radius:8px;
    padding:7px 14px;transition:background .12s ease,color .12s ease;
  }
  .btn-primary{background:var(--primary);color:var(--on-primary)}
  .btn-primary:hover{background:var(--primary-strong,#3450D8)}
  .btn-ghost{background:var(--bg);color:var(--ink)}
  .btn-ghost:hover{background:var(--ghost-hover)}
  .btn-sm{padding:5px 10px;font-size:12.5px}
  .btn-danger{background:transparent;color:var(--danger);padding:5px 10px;font-size:12.5px}
  .btn-danger:hover{background:var(--danger-weak)}
  .btn-link{background:transparent;color:var(--primary);padding:4px 6px;font-size:12.5px;font-weight:500}
  .btn-link:hover{text-decoration:underline}
  .btn:focus-visible,.nav-item:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

  /* ===== 角标 ===== */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;
         background:var(--bg);color:var(--ink-2);font-size:12px;font-weight:500;white-space:nowrap}
  .badge-ok{background:var(--ok-weak);color:var(--ok)}
  .badge-err{background:var(--err-weak);color:var(--danger)}
  .badge-primary{background:var(--primary-weak);color:var(--primary)}

  /* ===== 资源卡片墙 ===== */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px}
  /* 壁纸方案页：左列表 + 右编辑器（窄屏塌成一列） */
  .plan-cols{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;align-items:start}
  @media (max-width:1080px){.plan-cols{grid-template-columns:1fr}}
  .plan-item{padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--panel)}
  .plan-item:hover{border-color:var(--primary-line)}
  .plan-item.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
  .plan-item + .plan-item{margin-top:9px}
  .chip{display:inline-block;padding:3px 8px;border-radius:7px;background:var(--chip-bg);font-size:12px;margin:0 4px 4px 0}
  .res-card{
    position:relative;display:block;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius,12px);padding:16px 18px;cursor:pointer;color:var(--ink);
    text-decoration:none;transition:border-color .12s ease;
  }
  .res-card:hover{border-color:var(--primary-line)}
  .res-name{font-size:15px;font-weight:600;line-height:1.4;padding-right:64px}
  .res-card .meta{margin-top:5px}
  .res-foot{margin-top:13px}
  /* 排序箭头默认隐身，鼠标移到卡片上才出现 */
  .card-move{position:absolute;top:12px;right:12px;display:flex;gap:4px;opacity:0;transition:opacity .12s ease}
  .res-card:hover .card-move{opacity:1}
  .btn-move{
    border:0;background:var(--bg);color:var(--ink-2);width:26px;height:26px;border-radius:7px;
    font-size:10px;line-height:1;cursor:pointer;padding:0;
  }
  .btn-move:hover:not(:disabled){background:var(--primary-weak);color:var(--primary)}
  .btn-move:disabled{opacity:.3;cursor:default}

  /* ===== 拖拽区 ===== */
  .drop{
    border:1.5px dashed var(--drop-line,rgba(23,25,30,.18));border-radius:var(--radius,12px);padding:26px;text-align:center;
    background:var(--drop-bg);cursor:pointer;transition:border-color .12s ease,background .12s ease;
  }
  .drop.hot{border-color:var(--primary);background:var(--drop-hot-bg)}
  .drop .main{font-size:14px;font-weight:600;padding:0;margin:0}

  /* ===== 联调模式警示条 ===== */
  .dev-banner{
    display:flex;gap:10px;padding:11px 16px;border-radius:10px;background:var(--danger);color:var(--on-primary);
    font-size:13px;font-weight:500;line-height:1.65;
  }

  /* ===== toast / 弹层 ===== */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(8px);
    background:var(--toast-bg);color:var(--toast-ink);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;
    opacity:0;transition:opacity .2s ease,transform .2s ease;max-width:70vw;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .modal{position:fixed;inset:0;background:var(--mask);display:flex;align-items:center;
         justify-content:center;z-index:40}
  .modal .box{background:var(--panel);border-radius:14px;padding:24px;width:min(460px,92vw)}
  .modal-title{font-size:16px;font-weight:600;margin:0 0 16px}
  details summary{cursor:pointer;color:var(--ink-2);font-size:13px;list-style:none}
  details summary::-webkit-details-marker{display:none}

  /* ===== 响应式：窄屏侧栏变顶栏 ===== */
  @media (max-width: 960px){
    .sidebar{position:sticky;top:0;left:auto;bottom:auto;z-index:6;width:auto;height:auto;
             flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;
             border-right:0;border-bottom:1px solid var(--line);padding:10px 14px}
    .frame{margin-left:0}
    .brand{padding:0 14px 0 4px}
    .nav{flex-direction:row}
    main{padding:20px 16px 64px}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important}
  }
  /* 顶栏主题切换：三态文字按钮，占位与「连接」一致 */
  .theme-btn{
    font:inherit;font-size:12.5px;font-weight:500;color:var(--ink-3);background:transparent;
    border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;
    transition:color .12s ease,border-color .12s ease;white-space:nowrap;
  }
  .theme-btn:hover{color:var(--ink);border-color:var(--ink-3)}

  /* ===== 私信 ===== */
  .chat-split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:1100px){.chat-split{grid-template-columns:1fr}}
  .chat-list{max-height:560px;overflow:auto;margin:0 -8px}
  .chat-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-radius:8px;
            cursor:pointer;transition:background .12s ease}
  .chat-row:hover{background:var(--hover-bg)}
  .chat-row.active{background:var(--primary-weak)}
  .chat-row-name{font-size:13.5px;font-weight:600;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chat-row-preview{grid-column:1/2;font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chat-row-side{grid-row:1/3;grid-column:2/3;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .chat-row-time{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
  .chat-unread{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--primary);color:var(--on-primary);
               font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .chat-thread{display:flex;flex-direction:column;gap:10px;max-height:440px;overflow:auto;padding:2px 2px 6px}
  .chat-msg{display:flex;flex-direction:column;max-width:78%}
  .chat-msg.out{align-self:flex-end;align-items:flex-end}
  .chat-bubble{padding:9px 12px;border-radius:10px;background:var(--chip-bg);color:var(--ink);
               font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .chat-msg.out .chat-bubble{background:var(--primary-weak)}
  .chat-msg-time{font-size:11.5px;color:var(--ink-3);margin-top:4px}
  .chat-empty{padding:28px 0;text-align:center;color:var(--ink-3);font-size:13px}
  .chat-compose{display:flex;gap:10px;align-items:flex-end;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .chat-compose textarea{flex:1;min-height:72px;max-height:200px;resize:vertical;line-height:1.6}
  .chat-compose textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak)}
  .chat-conn{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<aside class="sidebar">
  <a class="brand" href="#/">
    <span class="brand-mark">盘</span>
    <span><span class="brand-name">盘坊</span><br/><span class="brand-sub">管理后台</span></span>
  </a>
  <nav class="nav" id="nav">
    <a class="nav-item" data-route="#/" href="#/">
      <svg class="ic" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5.2" height="5.2" rx="1.3"/><rect x="9.3" y="1.5" width="5.2" height="5.2" rx="1.3"/><rect x="1.5" y="9.3" width="5.2" height="5.2" rx="1.3"/><rect x="9.3" y="9.3" width="5.2" height="5.2" rx="1.3"/></svg>
      资源</a>
    <a class="nav-item" data-route="#/photo-albums" href="#/photo-albums">
      <svg class="ic" viewBox="0 0 16 16"><rect x="1.6" y="2.6" width="12.8" height="10.8" rx="2"/><circle cx="5.6" cy="6.4" r="1.2"/><path d="M3.2 12.2 6.8 8.6l2.2 2.2 1.8-1.8 2 2"/></svg>
      照片表盘</a>
    <a class="nav-item" data-route="#/editor-plans" href="#/editor-plans">
      <svg class="ic" viewBox="0 0 16 16"><rect x="2.2" y="1.8" width="11.6" height="12.4" rx="2"/><path d="M4.6 5.4h6.8M4.6 8h6.8M4.6 10.6h4"/></svg>
      壁纸方案</a>
    <a class="nav-item" data-route="#/devices" href="#/devices">
      <svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.3"/><path d="M6.1 4.8 6.3 1.6h3.4l.2 3.2M6.1 11.2l.2 3.2h3.4l.2-3.2"/></svg>
      设备组</a>
    <a class="nav-item" data-route="#/afdian" href="#/afdian">
      <svg class="ic" viewBox="0 0 16 16"><path d="M6.6 9.4 9.4 6.6"/><path d="M7.2 4.4 8.9 2.7a2.3 2.3 0 0 1 3.2 3.2l-1.7 1.7"/><path d="M8.8 11.6 7.1 13.3a2.3 2.3 0 0 1-3.2-3.2l1.7-1.7"/></svg>
      爱发电</a>
    <a class="nav-item" data-route="#/messages" href="#/messages">
      <svg class="ic" viewBox="0 0 16 16"><path d="M2.2 3.6h11.6v8.2H6.4L3.2 14V3.6z"/><path d="M5 6.6h6M5 9h4"/></svg>
      私信</a>
    <a class="nav-item" data-route="#/events" href="#/events">
      <svg class="ic" viewBox="0 0 16 16"><path d="M1.5 8h2.8L6 4.2 8.4 11.8 10.4 8h4.1"/></svg>
      客户端诊断</a>
    <a class="nav-item" data-route="#/app" href="#/app">
      <svg class="ic" viewBox="0 0 16 16"><path d="M8 10.6V2.2M5 5.2 8 2.2l3 3"/><path d="M2.5 9.8v3.9h11V9.8"/></svg>
      App 发版</a>
  </nav>
</aside>
<div class="frame">
  <header class="topbar">
    <span id="statLine"></span>
    <a class="diag-line" id="diagLine" href="#/events" style="display:none"></a>
    <span class="sp"></span>
    <button class="theme-btn" id="themeBtn" onclick="cycleTheme()" title="深色模式：跟随系统 / 浅色 / 深色">主题：跟随系统</button>
    <input id="token" type="password" placeholder="管理令牌" style="width:180px"/>
    <button class="btn btn-ghost btn-sm" onclick="saveToken()">连接</button>
  </header>
  <main id="app">
    <div id="devBanner"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
// 转义 HTML 特殊字符；**单引号也转**——值有时被拼进单引号包裹的 onclick 里（2026-10-15 补）
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token = () => localStorage.getItem('wf_admin_token') || '';
let STATE = { products: [], groups: [] };
let LAST_UPLOAD = '';
let LAST_UPLOAD_OWNER = '';

function toast(msg, bad){ const t=$('toast'); t.textContent=msg; t.style.background = bad? 'var(--danger)':'var(--toast-bg)'; t.style.color = bad? 'var(--on-primary)':'var(--toast-ink)'; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2400); }
function saveToken(){ localStorage.setItem('wf_admin_token', $('token').value.trim()); toast('已连接'); loadAll(); }
function fmtSize(n){ return n>1048576 ? (n/1048576).toFixed(2)+' MB' : Math.round(n/1024)+' KB'; }

async function api(path, opts={}){
  const isForm = opts.body instanceof FormData;
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), 90000);
  let r;
  try{
    r = await fetch(path, Object.assign({signal: ctl.signal, headers:Object.assign({'Authorization':'Bearer '+token()}, isForm?{}:{'Content-Type':'application/json'})}, opts));
  }catch(e){
    clearTimeout(timer);
    throw new Error(e.name==='AbortError' ? '请求超时，请重试' : ('网络错误：'+(e.message||e)));
  }
  clearTimeout(timer);
  const txt = await r.text(); let data=null;
  try{ data = txt? JSON.parse(txt): null; }catch(e){ data={message:txt}; }
  if(!r.ok){ const err = new Error((data&&(data.message||data.error))||('HTTP '+r.status)); err.code=data&&data.error; throw err; }
  return data;
}

// ---------- 路由
function go(hash){ location.hash = hash; }
/** 侧栏高亮：资源详情归到「资源」下 */
function setNav(){
  const h = location.hash || '#/';
  const match = r => r === h || (r === '#/' && h.startsWith('#/p/')) || (r === '#/devices' && h === '#/settings');
  document.querySelectorAll('.nav-item').forEach(el=>{
    if(match(el.getAttribute('data-route'))) el.classList.add('active');
    else el.classList.remove('active');
  });
}
async function render(){
  setNav();
  if(!token()){
    $('app').innerHTML = `<div class="panel"><div class="panel-title">先连接</div>
      <div class="panel-hint tight">在右上角填入管理令牌。</div></div>`;
    return;
  }
  const h = location.hash || '#/';
  try{
    if(h.startsWith('#/p/')) return renderDetail(h.slice(4));
    if(h==='#/photo-albums') return renderPhotoAlbums();
    if(h==='#/editor-plans') return renderEditorPlans();
    if(h==='#/devices' || h==='#/settings') return renderDeviceGroups();
    if(h==='#/afdian') return renderAfdian();
    if(h==='#/messages') return renderMessages();
    if(h==='#/events') return renderEvents();
    if(h==='#/app') return renderAppPage();
    return renderCards();
  }catch(e){ $('app').innerHTML = `<div class="panel"><div class="panel-title" style="color:var(--danger)">出错了</div><div class="panel-hint tight">${esc(e.message)}</div></div>`; }
}
window.addEventListener('hashchange', render);

// ---------- 首页
/** 资源卡片模板（排序箭头 hover 显现；只此一份，别再复制） */
function cardHtml(p, i, total){
  return `<a class="res-card" href="#/p/${esc(p.id)}">
    <div class="card-move">
      <button class="btn-move" title="前移" ${i===0? 'disabled':''}
              onclick="event.preventDefault();event.stopPropagation();moveProduct(${i},-1)">◀</button>
      <button class="btn-move" title="后移" ${i===total-1? 'disabled':''}
              onclick="event.preventDefault();event.stopPropagation();moveProduct(${i},1)">▶</button>
    </div>
    <div class="res-name">${esc(p.name)}</div>
    <div class="meta">${p.deviceCount}/${p.variantCount} 个设备已传包体 · 已购 ${p.buyers} 人</div>
    <div class="res-foot">${
      p.latestVersion
        ? `<span class="badge badge-primary">最新 ${esc(p.latestVersion)}</span>`
        : `<span class="badge">还没有包体</span>`}</div>
  </a>`;
}

async function renderCards(){
  const d = await api('/admin/products');
  STATE.products = d.products;
  $('app').innerHTML = `
    <div class="page-head">
      <div><h1 class="page-title">资源</h1>
        <p class="page-desc">表盘商品列表；点卡片进详情上传包体、配购买链接。右上角箭头可以调整展示顺序。</p></div>
      <span class="sp"></span>
      <button class="btn btn-primary" onclick="openNewResource()">新建资源</button>
    </div>
    <div class="cards">${STATE.products.map((p,i)=>cardHtml(p,i,STATE.products.length)).join('') || '<span class="meta">还没有资源</span>'}</div>`;
  loadStats();
}

/** 用内存里的顺序重画卡片墙（不重新拉数据，保证点击后立刻响应） */
function renderCardsFromState(){
  const grid = document.querySelector('.cards');
  if(grid) grid.innerHTML = STATE.products.map((p,i)=>cardHtml(p,i,STATE.products.length)).join('');
}

/** 卡片排序：本地先换位即时反馈，再把新顺序写回服务端 */
async function moveProduct(index, dir){
  const list = STATE.products.slice();
  const to = index + dir;
  if(to < 0 || to >= list.length) return;
  [list[index], list[to]] = [list[to], list[index]];
  STATE.products = list;
  renderCardsFromState();
  try{ await api('/admin/products/reorder',{method:'POST',body:JSON.stringify({ids:list.map(p=>p.id)})}); }
  catch(e){ toast('排序保存失败：'+e.message, true); }
}

function openNewResource(){
  document.body.insertAdjacentHTML('beforeend', `<div class="modal" id="m"><div class="box">
    <div class="modal-title">新建资源</div>
    <input id="np-name" placeholder="资源名称" style="width:100%"/>
    <div class="form-row" style="justify-content:flex-end;margin-top:20px">
      <button class="btn btn-ghost" onclick="document.getElementById('m').remove()">取消</button>
      <button class="btn btn-primary" onclick="createResource()">创建</button>
    </div></div></div>`);
  setTimeout(()=>{ const el=$('np-name'); if(el) el.focus(); }, 30);
}
async function createResource(){
  const name = $('np-name').value.trim();
  if(!name) return toast('请填资源名称', true);
  try{
    const d = await api('/admin/products',{method:'POST',body:JSON.stringify({name, device_group_ids:[]})});
    document.getElementById('m').remove(); toast('已创建'); go('#/p/'+d.productId);
  }catch(e){ toast(e.message, true); }
}

// ---------- 资源详情
/** 「照片表盘」角标：判据来自 .bin 内容（亮屏样式 backImageId 高字节 0x82），不看名字 */
function photoBadge(p){
  if(!p || !p.photoAlbum) return '';
  const manual = p.photoAlbumManual != null ? '<span class="badge" style="margin-left:5px">人工</span>' : '';
  return `<span class="badge badge-ok">照片表盘</span>${manual}`;
}

/** 设备行的「包体」单元格：单包 / 多包（按顺序依次安装） */
function packagesCell(v, productId){
  const pkg = v.package;
  const packs = (v.packages && v.packages.length) ? v.packages : (pkg ? [pkg] : []);
  if(!packs.length) return '<span class="badge badge-err">未上传</span>';
  const del = x => (x.fileId && productId) ? `<button class="btn btn-link" style="color:var(--danger);margin-left:6px"
      onclick="delPkg('${esc(productId)}','${esc(x.fileId)}','${esc(x.fileName)}')">删除</button>` : '';
  if(packs.length === 1){
    return `<div class="mono">${esc(packs[0].fileName)}</div>
            <div class="micro" style="margin-top:3px">${esc(packs[0].version||'')} · ${fmtSize(packs[0].size)} · ${esc(pkg&&pkg.canvas||'')}${del(packs[0])}</div>
            ${packs[0].photoAlbum? `<div style="margin-top:4px">${photoBadge(packs[0])}</div>`:''}`;
  }
  const tot = packs.reduce((s,x)=>s+(x.size||0),0);
  return `<div><span class="badge badge-primary">${packs.length} 个包</span>
            <span class="micro" style="margin-left:6px">共 ${fmtSize(tot)} · 按顺序依次安装</span></div>` +
    packs.map((x,i)=>`<div class="pack-line"><span class="mono">${i+1}. ${esc(x.fileName)}</span>
        <span class="micro">${esc(x.version||'')} · ${fmtSize(x.size)}</span>${x.photoAlbum? ' '+photoBadge(x):''}${del(x)}</div>`).join('');
}

/** 从设备行里删掉一个包（其余包保留；已经装了它的人不受影响） */
async function delPkg(productId, fileId, fileName){
  if(!confirm(`从这一行删除包「${fileName}」？\n\n已经装了它的人不受影响，但之后新装/更新不会再包含这个包。`)) return;
  try{
    const d = await api('/admin/files/'+encodeURIComponent(fileId), {method:'DELETE'});
    toast(d && d.variantEmptied ? '已删除最后一个包，这一行现在为空' : '已删除该包');
    renderDetail(productId);
  }catch(e){
    toast(e.message || '删除失败', true);
  }
}

/** 设备行的「购买链接」单元格：一条或多条爱发电链接 */
function linksCell(v, productId){
  const link = v.afdian || {};
  const links = link.links && link.links.length ? link.links : (link.planId? [link] : []);
  const sharedMax = Math.max(0, ...links.map(l=>l.shared||0));
  const shared = sharedMax > 1 ? `<span class="badge">共用 ${sharedMax} 处</span>` : '';
  const editBtn = `<button class="btn btn-link" onclick="editLink('${esc(v.id)}','${esc(productId)}')">改链接</button>`;
  if(!links.length){
    return `<div><span class="badge badge-err">未配购买链接</span>
              <button class="btn btn-ghost btn-sm" style="margin-left:6px"
                onclick="editLink('${esc(v.id)}','${esc(productId)}')">配置</button></div>
            <div id="lk-${esc(v.id)}"></div>`;
  }
  return `<div class="mono" style="color:var(--ink-2)">${esc(links[0].planId.slice(0,14))}…</div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px">
            ${links.length>1? `<span class="badge badge-primary">${links.length} 条链接</span>` : ''}
            ${shared}${editBtn}</div>
          <div id="lk-${esc(v.id)}"></div>`;
}

/** 上传**一批**包到某个设备行（一次请求可带多个 file）；成功返回响应，失败抛可读错误。 */
async function uploadBatch(productId, files, variantId, force){
  const fd = new FormData();
  for(const f of files){
    fd.append('file', f, f.name);
    fd.append('path_hint', f._rel || f.webkitRelativePath || f.name);
  }
  fd.append('product_id', productId);
  if(variantId) fd.append('variant_id', variantId);
  if(force) fd.append('force','true');
  return await api('/admin/versions/upload',{method:'POST',body:fd});
}

/** 上传一批；撞上版本规则时问一句再强制重传 */
async function uploadBatchAsk(productId, files, variantId){
  try{
    return await uploadBatch(productId, files, variantId, false);
  }catch(e){
    if(e.code === 'version_not_newer' && variantId && confirm(e.message + '，确认强制替换吗？')){
      return await uploadBatch(productId, files, variantId, true);
    }
    throw e;
  }
}

/** 上传结果里「替换/新增/未变/保留」各几个包 */
function mergeSummary(d){
  const fs = d.files || [];
  const n = a => fs.filter(x=>x.action===a).length;
  const bits = [];
  if(n('replaced')) bits.push(`替换 ${n('replaced')} 个包`);
  if(n('added')) bits.push(`新增 ${n('added')} 个包`);
  if(n('unchanged')) bits.push(`未变 ${n('unchanged')} 个包`);
  if(n('kept')) bits.push(`保留 ${n('kept')} 个包`);
  return bits.join('，');
}

/** 上传一个文件；成功返回 true（信息写进 file._msg），失败返回可读文案。 */
async function uploadOne(productId, file, variantId, force){
  try{
    const d = await uploadBatch(productId, [file], variantId, force);
    const sum = mergeSummary(d);
    file._msg = `${d.variantName}${d.createdRow? ' · 新设备':''} · ${d.replacedVersion? d.replacedVersion+' → ':''}${d.version}` + (sum? ` · ${sum}`:'');
    return true;
  }catch(e){
    if(e.code === 'version_not_newer' && variantId){
      if(confirm(e.message + '，确认强制替换吗？')) return uploadOne(productId, file, variantId, true);
    }
    return e.message || String(e);
  }
}

async function batchUpload(productId, files){
  const box = $('up-result');
  const draw = (lines, note) => {
    if(!box) return;
    box.innerHTML = `<div class="meta" style="margin-top:12px">${esc(note)}</div>` +
      lines.map(l=>`<div style="display:flex;align-items:center;gap:10px;margin-top:8px">
        <span class="badge ${l.ok? 'badge-ok':'badge-err'}">${l.ok? '已归位':'失败'}</span>
        <span class="mono">${esc(l.name)}</span>
        <span class="meta">${esc(l.msg||'')}</span></div>`).join('');
  };
  try{
    const bins = files.filter(f=>f && typeof f.name==='string' && f.name.toLowerCase().endsWith('.bin'));
    if(!bins.length){ toast('没有 .bin 文件', true); return; }
    const lines = [];
    draw(lines, `正在识别 ${bins.length} 个文件…`);

    // 1) 先空跑识别（只识别不写库），按「归到哪个设备行」分组：
    //    同一设备行的多个包 = 一批（同一个版本，按文件名顺序依次安装）
    const groups = new Map();
    for(const f of bins){
      try{
        const fd = new FormData();
        fd.append('file', f, f.name);
        fd.append('path_hint', f._rel || f.webkitRelativePath || f.name);
        fd.append('product_id', productId);
        const d = await api('/admin/inspect',{method:'POST',body:fd});
        const det = d.detection || {};
        const key = det.variantId || (det.deviceGroupId? 'g:'+det.deviceGroupId : 'unknown:'+f.name);
        if(!groups.has(key)) groups.set(key, { variantId: det.variantId||'', label: det.variantName || det.deviceGroupName || '未知设备', files: [] });
        groups.get(key).files.push(f);
      }catch(e){
        lines.push({ name: f.name, ok: false, msg: '识别失败：' + (e && (e.message||e)) });
      }
    }
    draw(lines, `识别完成：${groups.size} 个设备行，开始上传…`);

    // 2) 每行一次请求（多包同版本）
    let ok = 0, fail = 0;
    for(const [, g] of groups){
      const label = g.label + (g.files.length > 1 ? `（${g.files.length} 个包）` : '');
      try{
        const d = await uploadBatchAsk(productId, g.files, g.variantId);
        const names = (d.files||[]).map(x=>x.fileName).join(' → ');
        const sum = mergeSummary(d);
        lines.push({ name: label, ok: true,
          msg: `${d.createdRow? '新设备 · ':''}${d.replacedVersion? d.replacedVersion+' → ':''}${d.version}` +
               (sum? ` · ${sum}`:'') +
               ((d.files||[]).length>1? ` · 顺序 ${names}` : '') });
        ok += g.files.length;
      }catch(e){
        lines.push({ name: label, ok: false, msg: (e && (e.message||e)) || String(e) });
        fail += g.files.length;
      }
      draw(lines, `上传中 ${ok+fail}/${bins.length}…`);
    }
    draw(lines, `完成：成功 ${ok}，失败 ${fail}`);
    toast(`上传完成：成功 ${ok}，失败 ${fail}`, fail > 0);
    LAST_UPLOAD_OWNER = productId;
    LAST_UPLOAD = box ? box.innerHTML : '';
    render();
  }catch(e){
    draw([], '出错了：' + (e && (e.message||String(e))));
    toast('上传出错了', true);
  }
}

function uploadRow(variantId, productId){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.bin';
  inp.onchange = async ()=>{ const f=inp.files[0]; if(!f) return; await uploadOne(productId, f, variantId, false); render(); };
  inp.click();
}

async function editLink(variantId, productId){
  const box = $('lk-'+variantId);
  if(!box) return;
  if(box.innerHTML){ box.innerHTML=''; return; }

// ---------- 壁纸方案（照片表盘的壁纸生成规则：方案 + 素材都由 App 拉走，不发版）
STATE.plans = {};

/** 方案骨架：三种形态，画布尺寸从设备行带过来（对不上的方案 App 会自己拒绝） */
/** 屏幕圆角（跟底图网站的机型值一致）：手环 9/10 圆角到顶 = 跑道屏 */
const SCREEN_RADIUS = { "192x490": 96, "212x520": 106, "336x480": 45, "432x514": 104 };

function planSkeleton(kind, w, h, win){
  const ctl = (darken, blur) => ({
    scale:    { default: 1,  min: 0.2, max: 3,   step: 0.01, adjustable: true },
    rotation: { default: 0,  min: -180, max: 180, step: 1,    adjustable: true },
    darken:   { default: darken, min: 0, max: 1, step: 0.01, adjustable: true },
    blur:     { default: blur,   min: 0, max: 40, step: 1,   adjustable: true },
    flipX:    { default: false, adjustable: true },
    flipY:    { default: false, adjustable: true }
  });
  const photos = [];
  if(kind === 'layered'){
    // 拍立得：底图铺满 + 相框里第二张（底图默认压暗 0.3 + 模糊 8，与网站一致）
    photos.push({ id:'bg', label:'背景照片', base:'canvas', controls: ctl(0.3, 8) });
    photos.push({ id:'inner', label:'相框内照片', base:'frame', controls: ctl(0, 0) });
  }else{
    photos.push({ id:'bg', label: kind === 'template' ? '照片' : '照片', base:'canvas', controls: ctl(0, 0) });
  }
  const cfg = { version: 1, canvas: { w: w, h: h, radius: SCREEN_RADIUS[w + "x" + h] || 0 }, photos };
  if(kind !== 'plain'){
    cfg.frame = {};
    if(kind === 'layered' && win) cfg.frame.window = win;
    cfg.frame.colors = [];
  }
  return cfg;
}

async function loadEditorPlans(){

function mkSkeleton(){
  const kind = $('ep-kind').value;
  const w = parseInt($('ep-w').value, 10) || 212;
  const h = parseInt($('ep-h').value, 10) || 520;
  let win = null;
  const g = id => { const v = parseFloat($(id).value); return isNaN(v) ? null : v; };
  const x = g('ep-x'), y = g('ep-y'), ww = g('ep-ww'), wh = g('ep-wh');
  if(x !== null && y !== null && ww && wh){
    win = { x, y, w: ww, h: wh, radius: g('ep-r') || 0, rot: g('ep-rot') || 0 };
  }
  if(kind === 'layered' && !win){ toast('拍立得要填画框窗口（x/y/宽/高）', true); return; }
  $('ep-json').value = JSON.stringify(planSkeleton(kind, w, h, win), null, 2);
  toast('骨架已生成，改完点保存');
}

async function saveEditorPlan(wfid){
  const cfg = $('ep-json').value;
  try{ JSON.parse(cfg); }catch(e){ toast('JSON 不合法：' + e.message, true); return; }
  const fd = new FormData();
  fd.append('watchface_id', wfid);
  fd.append('config', cfg);
  const files = $('ep-files').files;
  for(const f of files) fd.append('file', f, f.name);
  try{
    const r = await api('/admin/editor-template', { method:'POST', body: fd });
    if(r.missing && r.missing.length){
      toast('已保存，但这些素材还缺：' + r.missing.join('、'), true);
    }else{
      toast(r.assets ? `已保存（本批写入 ${r.assets.length} 个素材）` : '已保存');
    }
    openEditorPlan(wfid);
    loadEditorPlans();
  }catch(e){ toast(e.message, true); }
}

async function deleteEditorPlan(wfid){
  if(!confirm('删除这个表盘的壁纸方案？（素材也一并删）')) return;
  try{
    await api('/admin/editor-template/' + encodeURIComponent(wfid), { method:'DELETE' });
    toast('已删除');
    $('ep-edit').innerHTML = '<div class="panel-hint tight">已删除，左侧重新选一个表盘。</div>';

/** 时间戳可能是秒/毫秒数字，也可能是字符串；统一显示成本地时间 */
function fmtSentAt(v){
  if(v===null || v===undefined || v==='') return '';
  let d = null;
  if(typeof v==='number' || /^\d+$/.test(String(v))){
    const n = Number(v);
    d = new Date(n < 1e12 ? n*1000 : n);
  }else{
    d = new Date(v);
  }
  if(isNaN(d.getTime())) return String(v);
  const p = x => String(x).padStart(2,'0');
  return `${d.getMonth()+1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function chatSend(){
  const el = $('chat-input');
  const content = el ? el.value.trim() : '';
  if(!content){ toast('消息不能为空', true); return; }
  if(Array.from(content).length > 1500){ toast('消息太长（上限 1500 字）', true); return; }
  try{
    await api('/admin/afdian/chat/send', {method:'POST', body:JSON.stringify({user_id:CHAT.activeUserId, content})});
    toast('已发送');
    if(el) el.value = '';
    await loadChatThread();
    await loadChatDialogs();
  }catch(e){ toast(e.message, true); }
}

// ---------- 关键词自动回复
let AR = { enabled: false, rules: [] };

async function loadChatRules(){
  const box = $('ar-rules');
  if(!box) return;
  try{
    const d = await api('/admin/afdian/chat/rules');
    AR = { enabled: d.enabled === true, rules: d.rules || [] };
    const cb = $('ar-enabled');
    if(cb) cb.checked = AR.enabled;
    renderArState(d);
    renderArRules(AR.rules);
    renderArLogs(d.logs || []);
  }catch(e){
    box.innerHTML = `<span class="meta" style="color:var(--danger)">${esc(e.message)}</span>`;
  }
}

function renderArState(d){
  const el = $('ar-state');
  if(!el) return;
  if(!d.enabled){
    el.innerHTML = '<span class="badge">已关闭</span> 打开右侧开关后才会自动回复';
    return;
  }
  const when = d.lastPollAt ? esc(fmtSentAt(d.lastPollAt)) : '还没检查过';
  if(d.lastPollError){
    el.innerHTML = `<span class="badge badge-err">需要留意</span> ${esc(d.lastPollError)} · ${when}`;
  }else if(!d.initialized){
    el.innerHTML = `<span class="badge badge-primary">等待首次检查</span> 下一轮只记录当前进度，不会回复历史消息 · ${when}`;
  }else{
    el.innerHTML = `<span class="badge badge-ok">运行中</span> 上次检查 ${when}`;
  }
}

function renderArRules(rules){
  const box = $('ar-rules');
  if(!box) return;
  if(!rules.length){
    box.innerHTML = '<div class="chat-empty">还没有规则。点右上角「新增规则」开始。</div>';
    return;
  }
  box.innerHTML = `<table class="tbl">
    <thead><tr>
      <th style="width:54px">启用</th><th style="width:24%">关键词（逗号分隔）</th>
      <th style="width:12%">匹配</th><th>回复内容</th><th class="col-actions" style="width:64px"></th>
    </tr></thead>
    <tbody>${rules.map(r=>`<tr data-rule-id="${esc(r.id)}">
      <td><input type="checkbox" class="ar-on" ${r.enabled?'checked':''}/></td>
      <td><input class="ar-kw" value="${esc((r.keywords||[]).join('，'))}" placeholder="安装, 怎么装" style="width:100%"/></td>
      <td><select class="ar-mode">
        <option value="any" ${r.matchMode==='any'?'selected':''}>包含任意</option>
        <option value="all" ${r.matchMode==='all'?'selected':''}>包含全部</option>
        <option value="exact" ${r.matchMode==='exact'?'selected':''}>完全等于</option>
      </select></td>
      <td><textarea class="ar-reply" style="width:100%;min-height:64px" placeholder="命中后自动发送的话术">${esc(r.reply||'')}</textarea></td>
      <td class="col-actions"><button class="btn btn-danger btn-sm" onclick="chatRemoveRule(this)">删除</button></td>

function chatAddRule(){
  const box = $('ar-rules');
  if(!box) return;
  if(!box.querySelector('tbody')){
    box.innerHTML = `<table class="tbl">
      <thead><tr>
        <th style="width:54px">启用</th><th style="width:24%">关键词（逗号分隔）</th>
        <th style="width:12%">匹配</th><th>回复内容</th><th class="col-actions" style="width:64px"></th>
      </tr></thead><tbody></tbody></table>`;
  }
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><input type="checkbox" class="ar-on" checked/></td>
    <td><input class="ar-kw" placeholder="安装, 怎么装" style="width:100%"/></td>
    <td><select class="ar-mode">
      <option value="any">包含任意</option><option value="all">包含全部</option><option value="exact">完全等于</option>
    </select></td>
    <td><textarea class="ar-reply" style="width:100%;min-height:64px" placeholder="命中后自动发送的话术"></textarea></td>
    <td class="col-actions"><button class="btn btn-danger btn-sm" onclick="chatRemoveRule(this)">删除</button></td>`;
  box.querySelector('tbody').appendChild(tr);
}

function chatRemoveRule(btn){
  const tr = btn.closest('tr');
  if(tr) tr.remove();
}

function chatCollectRules(){
  return Array.from(document.querySelectorAll('#ar-rules tr')).map(tr=>{
    const id = tr.getAttribute('data-rule-id') || '';
    const on = tr.querySelector('.ar-on');
    const kw = tr.querySelector('.ar-kw');
    const mode = tr.querySelector('.ar-mode');
    const reply = tr.querySelector('.ar-reply');
    return {
      id: id || null,
      enabled: !!(on && on.checked),
      keywords: (kw ? kw.value : '').split(/[，,]/).map(s=>s.trim()).filter(Boolean),
      matchMode: mode ? mode.value : 'any',
      reply: reply ? reply.value.trim() : '',
    };
  });
}

async function chatSaveRules(){
  try{
    await api('/admin/afdian/chat/rules', {method:'POST', body:JSON.stringify({rules: chatCollectRules()})});
    toast('规则已保存');
    await loadChatRules();
  }catch(e){ toast(e.message, true); }
}

async function chatToggleAutoReply(){
  const cb = $('ar-enabled');
  const want = !!(cb && cb.checked);
  if(want){
    const usable = chatCollectRules().filter(r=>r.enabled && r.keywords.length && r.reply).length;
    if(!usable){
      if(cb) cb.checked = false;
      toast('先保存至少一条可用规则，再开启自动回复', true);
      return;
    }
    if(!confirm('开启后，命中关键词的新私信会自动回复固定话术（不可撤回）。确定开启？')){
      if(cb) cb.checked = false;
      return;
    }
  }
  try{
    await api('/admin/afdian/chat/auto-reply', {method:'POST', body:JSON.stringify({enabled: want})});
    toast(want ? '自动回复已开启' : '自动回复已关闭');
    await loadChatRules();
  }catch(e){
    if(cb) cb.checked = !want;
    toast(e.message, true);
  }
}

async function chatTestRule(){
  const el = $('ar-test');
  const out = $('ar-test-result');
  const text = el ? el.value.trim() : '';
  if(!out) return;
  if(!text){ out.innerHTML = '<span style="color:var(--danger)">先输入一句话再测试</span>'; return; }
  try{
    const d = await api('/admin/afdian/chat/rules/test', {method:'POST', body:JSON.stringify({text})});
    out.innerHTML = d.matched
      ? `命中「${esc(d.keyword)}」，将发送：<br/><span class="mono">${esc(d.reply)}</span>`
      : '没有命中任何规则（不会自动回复）';
  }catch(e){
    out.innerHTML = `<span style="color:var(--danger)">${esc(e.message)}</span>`;
  }
}

function renderArLogs(logs){
  const box = $('ar-logs');
  if(!box) return;
  if(!logs.length){
    box.innerHTML = '<span class="meta">还没有自动回复记录</span>';
    return;

  box.innerHTML = `<table class="tbl">
    <thead><tr><th style="width:20%">买家</th><th>发送内容</th><th style="width:14%">命中</th><th style="width:16%">时间</th></tr></thead>
    <tbody>${logs.map(l=>`<tr>
      <td>${esc(l.userName||'爱发电用户')}</td>

      <td>${esc(l.keyword||'')}</td>
      <td class="meta">${esc(fmtSentAt(l.ts))}</td>
    </tr>`).join('')}</tbody></table>`;
}

  setTimeout(()=>void loadEvents(), 0);
  const sort = localStorage.getItem(EV_SORT_KEY) || 'count';
  const days = localStorage.getItem(EV_DAYS_KEY) || '7';
  const progress = localStorage.getItem(EV_PROGRESS_KEY) === '1';
  $('app').innerHTML = `
    <div class="page-head">
      <div><h1 class="page-title">客户端诊断</h1>
        <p class="page-desc">App 里「哪一步失败了、哪台手机、什么错误码」。买家那边只看到一句操作指引，细节只到这里。
          同一台手机的每次安装有独立设备指纹；老版本没上报指纹时按 IP 归并。
          默认不显示「过程事件」（掉线自动重连、15 秒中间态）——它们不是最终失败，勾选后可查看。</p></div>
      <span class="sp"></span>
      <div class="form-row" style="margin:0">
        <select id="ev-days" onchange="loadEvents()">
          <option value="7" ${days==='7'?'selected':''}>近 7 天</option>
          <option value="30" ${days==='30'?'selected':''}>近 30 天</option>
          <option value="1" ${days==='1'?'selected':''}>近 24 小时</option>
        </select>
        <select id="ev-sort" onchange="loadEvents()">
          <option value="count" ${sort==='count'?'selected':''}>按次数排序</option>
          <option value="time" ${sort==='time'?'selected':''}>按时间排序</option>
        </select>
        <label class="check"><input type="checkbox" id="ev-progress" ${progress?'checked':''} onchange="loadEvents()"/> 包含过程事件</label>
        <button class="btn btn-ghost" onclick="loadEvents()">刷新</button>
      </div>
    </div>
    <div class="panel"><div id="ev-box"></div></div>`;
}

/** App 发版：列表 + 发布 + 切当前（客户端本体的更新通道） */
async function loadAppReleases(){
  const box = $('app-rel-list');
  if(!box) return;
  try{
    const d = await api('/admin/app/releases');
    const rel = d.releases||[];
    box.innerHTML = rel.length ? `<table class="tbl">
      <thead><tr><th>版本</th><th>versionCode</th><th>大小</th><th>更新说明</th><th>状态</th><th></th><th class="col-actions"></th></tr></thead>
      <tbody>${rel.map(r=>`<tr>
        <td><span class="mono">${esc(r.versionName)}</span></td>
        <td><span class="mono num">${r.versionCode}</span></td>
        <td><span class="mono num">${fmtSize(r.size)}</span></td>
        <td class="meta" style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.notes||'')}</td>
        <td>${r.isCurrent? '<span class="badge badge-ok">当前版本</span>' : ''}</td>
        <td>${r.isCurrent? '' : `<button class="btn btn-ghost btn-sm" onclick="setAppCurrent(${r.id})">设为当前</button>`}</td>
        <td class="col-actions">
          <a class="btn btn-link" href="/app/${encodeURIComponent(r.fileName)}" target="_blank">下载</a>
          ${r.isCurrent? '' : `<button class="btn btn-danger" onclick="delAppRelease(${r.id},'${esc(r.versionName)}')">删除</button>`}</td>
      </tr>`).join('')}</tbody></table>` : '<span class="meta">还没有发布过版本</span>';
    const cur = rel.find(r=>r.isCurrent);
    const st = $('app-rel-state');
    if(st) st.textContent = cur ? `当前 ${cur.versionName} · sha256 ${cur.sha256.slice(0,8)}…` : '';
  }catch(e){ box.innerHTML = `<div class="meta">发版列表读取失败：${esc(e.message)}</div>`; }
}
function appFillVersion(){
  const inp = $('app-apk'); const f = inp && inp.files[0];
  if(!f) return;
  const m = f.name.match(/(\d+\.\d+\.\d+)/);
  if(m){
    $('app-ver').value = m[1];
    const p = m[1].split('.').map(Number);
    $('app-code').value = p[0]*1000000 + p[1]*1000 + p[2];
  }
}
async function publishAppRelease(){
  const inp = $('app-apk'); const f = inp && inp.files[0];
  if(!f) return toast('先选一个 APK 文件', true);
  const ver = $('app-ver').value.trim(), code = $('app-code').value.trim();
  if(!ver || !code) return toast('版本号与 versionCode 都要填', true);
  const fd = new FormData();
  fd.append('file', f);
  fd.append('version_name', ver);
  fd.append('version_code', code);
  fd.append('notes', $('app-notes').value.trim());
  if($('app-force').checked) fd.append('force', '1');
  toast('上传中（约 ' + fmtSize(f.size) + '）…');
  try{
    const r = await api('/admin/app/releases', {method:'POST', body: fd});
    toast('已发布 ' + r.versionName);
    inp.value = ''; $('app-notes').value = ''; $('app-force').checked = false;
    loadAppReleases();
  }catch(e){ toast('发布失败：'+e.message, true); }
}
async function setAppCurrent(id){
  try{ await api('/admin/app/releases/'+id+'/current', {method:'POST'}); toast('已切换'); loadAppReleases(); }
  catch(e){ toast(e.message, true); }
}
async function delAppRelease(id, ver){
  if(!confirm('删除版本 ' + ver + '（连同服务器上的安装包）？')) return;
  try{ await api('/admin/app/releases/'+id, {method:'DELETE'}); toast('已删除'); loadAppReleases(); }
  catch(e){ toast(e.message, true); }
}

/** 全量拉取历史订单（后台跑）：点一次 → 轮询进度 → 完了报数 */
async function afdianBackfill(){
  const box = $('af-backfill');
  try{
    const d = await api('/admin/afdian/sync',{method:'POST',body:JSON.stringify({pages:0})});
    if(d.backfill === 'already_running'){ box.textContent = '已经在拉了，等它跑完…'; }
    else { box.textContent = '正在后台拉取全部历史订单…'; }
    pollBackfill(0);
  }catch(e){ toast(e.message, true); }
}
function pollBackfill(n){
  const box = $('af-backfill');
  const tick = async ()=>{
    try{
      const d = await api('/admin/afdian/sync-status');
      if(d.running){ box.textContent = '正在拉取…（订单多时要几分钟，可去忙别的）'; return setTimeout(tick, 4000); }
      const last = d.last || {};
      box.textContent = last.ok
        ? `上次全量拉取：${last.orders} 单，新开通 ${(last.summary&&last.summary.new_grants||[]).length}，未绑定 ${(last.summary&&last.summary.unbound)||0}`
        : (last.error ? `上次全量拉取失败：${last.error}` : '还没有跑过全量拉取');
      toast('全量拉取完成');
      loadAfdian();
    }catch(e){ box.textContent = ''; }
  };
  setTimeout(tick, 1500);
}

async function afdianSim(status){
  const sel = $('af-plan');

  const sku = sel.selectedOptions[0]?.dataset?.sku || null;
  const body = {afdian_user_id:$('af-uid').value.trim()||null, plan_id:plan, sku,
                status, mi_user_id:$('af-mi2').value.trim()||null};
  try{
    const d = await api('/admin/afdian/simulate',{method:'POST',body:JSON.stringify(body)});
    const s = d.summary||{};
    toast(`模拟订单 → 新开通 ${(s.new_grants||[]).length}，收回 ${(s.revoked||[]).length}，未绑定 ${s.unbound||0}`);

}

/** 失败打点提示：>0 就在顶栏亮一条（以前这类信号在 App 里就断了，卖家看不到） */
function renderDiagLine(devices, events, progress){
  const el = $('diagLine'); if(!el) return;
  if(devices > 0){
    el.style.display='';
    el.textContent = `近 7 天 ${devices} 台设备报告 ${events} 条客户端失败`
      + (progress>0 ? `（另有 ${progress} 条过程事件已折起）` : '') + ' ›';
  }
  else { el.style.display='none'; }
}

function fmtTs(ts){
  if(!ts) return '';
  const d = new Date(ts*1000), p = n=>String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/** 客户端诊断：按设备分组（区分不同人）+ 按步骤聚合（可切换按次数/按时间）+ 最近原文 */
async function loadEvents(){
  const box = $('ev-box'); if(!box) return;
  const days = ($('ev-days')||{}).value || 7;
  const sort = ($('ev-sort')||{}).value || 'count';
  const includeProgress = !!($('ev-progress')||{}).checked;
  localStorage.setItem(EV_DAYS_KEY, days);
  localStorage.setItem(EV_SORT_KEY, sort);
  localStorage.setItem(EV_PROGRESS_KEY, includeProgress ? '1' : '0');
  box.innerHTML = '<div class="meta">读取中…</div>';
  try{
    const d = await api(`/admin/events?days=${encodeURIComponent(days)}&limit=30&sort=${encodeURIComponent(sort)}&include_progress=${includeProgress?1:0}`);
    if(!d.total){
      box.innerHTML = `<div class="meta">近 ${days} 天没有真失败`
        + (d.progressTotal ? `；另有 ${d.progressTotal} 条过程事件已折起` : '') + ' 👍</div>';
      return;
    }
    const devRows = (d.byDevice||[]).map(x=>{
      const dev = x.deviceFp
        ? `设备 <span class="mono">${esc(String(x.deviceFp).slice(0,8))}</span>`
        : `IP <span class="mono">${esc(x.ip||'—')}</span>`;
      const acc = x.subject ? `<span class="mono">${esc(x.subject)}</span>` : '<span class="meta">未登录</span>';
      const last = [x.lastStep, x.lastCode, x.lastMessage].filter(Boolean).join(' · ');
      return `<tr>
        <td>${dev}</td>
        <td class="meta">${esc(x.phone||'—')}</td>
        <td class="meta">${esc(x.deviceModel||'—')}</td>
        <td>${acc}</td>
        <td class="meta mono">${esc(x.ip||'—')}</td>
        <td><span class="num">${x.count} 次</span></td>
        <td class="meta num">${fmtTs(x.lastTs)}</td>
        <td class="meta">${esc(last)}</td>
      </tr>`;
    }).join('');
    const byDev = `<table class="tbl">
      <thead><tr><th style="width:110px">设备（人）</th><th>手机 / 系统</th><th style="width:140px">手环</th><th style="width:170px">账号</th><th style="width:130px">IP</th><th style="width:70px">次数</th><th style="width:110px">最近一次</th><th>最近问题</th></tr></thead>
      <tbody>${devRows}</tbody></table>`;
    const agg = `<table class="tbl">
      <thead><tr><th style="width:110px">步骤</th><th style="width:150px">错误码</th><th style="width:70px">次数</th><th style="width:80px">涉及设备</th><th style="width:110px">最近一次</th><th>详情（最近一台）</th></tr></thead>
      <tbody>${(d.byStep||[]).map(x=>`<tr>
        <td><span class="mono">${esc(x.step)}</span>${x.progress?' <span class="meta">过程</span>':''}</td>
        <td><span class="mono" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block">${esc(x.code||'—')}</span></td>
        <td><span class="num">${x.count} 次</span></td>
        <td><span class="num">${x.deviceCount||1}</span></td>
        <td class="meta num">${fmtTs(x.lastTs)}</td>
        <td class="meta">${esc([x.who, x.deviceModel, x.appVersion?('v'+x.appVersion):'', x.message].filter(Boolean).join(' · '))}</td>
      </tr>`).join('')}</tbody></table>`;
    const recent = (d.recent||[]).map(x=>
      `<div class="meta num" style="padding:3px 0">${fmtTs(x.ts)} · ${x.progress?'[过程] ':''}${esc(x.who||'')} · ${esc(x.step)} · ${esc(x.code||'—')} · ${esc([x.deviceModel, x.message].filter(Boolean).join(' · '))}</div>`).join('');
    const sortLabel = sort === 'time' ? '按时间排序（最新的在上面）' : '按次数排序（最多的在上面）';
    const hiddenNote = (!includeProgress && d.progressTotal)
      ? ` · 另有 ${d.progressTotal} 条过程事件已折起（勾选「包含过程事件」可查看）` : '';
    const scopeNote = includeProgress ? '（含过程事件）' : '真失败记录';
    box.innerHTML = `<div class="meta" style="margin-bottom:10px">近 ${days} 天共 ${d.total} 条${scopeNote}，来自 ${d.devices||0} 台设备 · ${sortLabel}${hiddenNote}</div>
      <h2 class="panel-title" style="margin:2px 0 8px">按设备（人）</h2>
      ${byDev}
      <h2 class="panel-title" style="margin:18px 0 8px">按步骤</h2>
      ${agg}
      <details style="margin-top:12px"><summary>最近 ${(d.recent||[]).length} 条原文</summary><div style="margin-top:6px">${recent}</div></details>`;
  }catch(e){ box.innerHTML = `<div class="meta">读取失败：${esc(e.message)}</div>`; }
}

// ---------- 深色模式：三态（跟随系统 / 浅色 / 深色），记忆在 localStorage
const THEME_KEY = 'wf_admin_theme';
const THEME_LABEL = { system:'主题：跟随系统', light:'主题：浅色', dark:'主题：深色' };
function sysDark(){ return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
function applyTheme(mode){
  const dark = mode === 'dark' || (mode === 'system' && sysDark());
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const btn = $('themeBtn'); if(btn) btn.textContent = THEME_LABEL[mode] || THEME_LABEL.system;
}
function cycleTheme(){
  const cur = localStorage.getItem(THEME_KEY) || 'system';
  const next = cur === 'system' ? 'light' : cur === 'light' ? 'dark' : 'system';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
}if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
  if((localStorage.getItem(THEME_KEY) || 'system') === 'system') applyTheme('system');
});

window.addEventListener('load', ()=>{ applyTheme(localStorage.getItem(THEME_KEY) || 'system'); $('token').value = token(); loadAll(); });
</script>
</body>
</html>
