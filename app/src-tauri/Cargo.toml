[package]
name = "wf_installer"
version = "0.3.99"
description = "小米 Vela 设备表盘安装工具（个人/私域使用）"
edition = "2024"
default-run = "wf_installer"

[lib]
name = "wf_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# WebP 必须显式打开：很多手机的相册/截图/微信保存默认就是 WebP，
# 前端 accept="image/*" 会把它一路送到这里，没这个 feature 就会报
# "The image format WebP is not supported"（2026-10-17 线上 3 次）。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tauri = { version = "2.11.3", features = ["rustls-tls"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
reqwest = { version = "0.12.22", features = ["json", "rustls-tls", "cookies", "multipart"], default-features = false }
reqwest_cookie_store = "0.8.0"
url = "2.5.8"
base64 = "0.22.1"
sha1 = "0.10.6"
sha2 = "0.10.9"
md-5 = "0.10.6"
rc4 = "0.1.0"
cipher = "0.4"
rand = "0.8.5"
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hex = "0.4"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

corelib = { path = "../../repos/AstroBox-NG/src-tauri/modules/core", default-features = false }
pb = { path = "../../repos/AstroBox-NG/src-tauri/modules/pb" }
account = { path = "../../repos/AstroBox-NG/src-tauri/modules/account" }
bluetooth = { path = "../../repos/AstroBox-NG/src-tauri/modules/bluetooth" }
# vivo 绑定域的 MsgPack 消息定义（BindAuth / BindInit 等，来自 corelib 同源的 vivo 栈）
vivo-msgpack = { path = "../../repos/AstroBox-NG/src-tauri/modules/vivo_msgpack" }
inappbrowser = { path = "../../repos/AstroBox-NG/src-tauri/plugins/inappbrowser" }
# App 自更新用：检查未知来源授权 + 调系统安装器（我们自己的插件，源码在本仓 plugins/apkinstaller）
apkinstaller = { path = "plugins/apkinstaller" }
# 连接保活：前台服务钉住进程（防后台冻结）+ 常驻静默通知（源码在本仓 plugins/connkeep）
connkeep = { path = "plugins/connkeep" }
# 直接依赖，确保 tauri CLI 的安卓插件扫描能发现它（它是 bluetooth 的二级依赖）
btclassic-spp = { path = "../../repos/AstroBox-NG/src-tauri/plugins/btclassic-spp" }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[profile.release]
strip = true
# 跨 crate 内联 + 全局死代码消除（不降 opt-level，壁纸生成逐像素运算不能慢）。
# ★ codegen-units=16（2026-11-15 实测 A/B，同为 gradle 热缓存）：
#   出包 37s vs cgu=1 的 80s，快一倍；代价是包体 8.11MB → 8.66MB（+0.55MB）。
#   （gradle/vite 缓存也是冷的那次，16 用了 116s。）
lto = "fat"
codegen-units = 16
# 掉 unwind 表；移动端进程崩溃本来也是整进程退出，没有可捕获的恢复路径
panic = "abort"
